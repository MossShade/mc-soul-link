plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom.log4jConfigs.from "log4j-dev.xml"


repositories {

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	filteringCharset = "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

def targetJavaVersion = Integer.parseInt(java_version)
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = targetJavaVersion
}

java {
	withSourcesJar()

	def javaVersion = JavaVersion.toVersion(targetJavaVersion)

	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}


// Build resource pack
def fabricModJsonFile = file("src/main/resources/fabric.mod.json")
def fabricModMetadata = new JsonSlurper().parse(fabricModJsonFile)
def resourcePackName = fabricModMetadata.name
def resourcePackIconPath = fabricModMetadata.icon
def resourcePackSupportedFormats = project.pack_supported_formats
		.split(',')
		.collect { it.trim() }
		.findAll { !it.isEmpty() }
		.collect { (it.toString().contains("."))? Double.parseDouble(it) : Integer.parseInt(it) }
def pack_format = (project.pack_format.toString().contains("."))?
		Double.parseDouble(project.pack_format.toString())
		: Integer.parseInt(project.pack_format.toString())
def min_format = (project.pack_min_format.toString().contains("."))?
		Double.parseDouble(project.pack_min_format.toString())
		: Integer.parseInt(project.pack_min_format.toString())
def max_format = (project.pack_max_format.toString().contains("."))?
		Double.parseDouble(project.pack_max_format.toString())
		: Integer.parseInt(project.pack_max_format.toString())

def packMcmeta = [
		pack: [
				description      : "Resource pack for ${resourcePackName} mod",
				pack_format      : pack_format,
				min_format       : min_format,
				max_format       : max_format,
				supported_formats: resourcePackSupportedFormats
		]
]

tasks.register("buildResourcePack", Zip) {
	group = "build"
	description = "Builds a standalone resource pack zip from src/main/resources/assets."

	archiveBaseName = "${project.archives_base_name}-resourcepack"
	archiveVersion = project.version.toString()
	destinationDirectory = layout.buildDirectory.dir("libs")

	from("src/main/resources/assets") {
		exclude(resourcePackIconPath.replaceFirst("^assets/", ""))
		into("assets")
	}

	from("src/main/resources") {
		include(resourcePackIconPath)
		eachFile { details ->
			details.path = details.name
		}
		includeEmptyDirs = false
	}

	from(resources.text.fromString(JsonOutput.prettyPrint(JsonOutput.toJson(packMcmeta)))) {
		rename { "pack.mcmeta" }
		into("/")
	}
}